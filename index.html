   const now={}; current.forEach(x=>{if(x&&x.id)now[cloudDocId(x)]=x});
   const ops=[];
   for(const [id,obj] of Object.entries(now)){
    if(!old[id]||JSON.stringify(old[id])!==JSON.stringify(obj))ops.push({type:'set',id,obj});
   }
   for(const id of Object.keys(old))if(!now[id])ops.push({type:'del',id});
   for(let i=0;i<ops.length;i+=450){
    const batch=cloudDB.batch();
    ops.slice(i,i+450).forEach(op=>{const ref=cloudDB.collection(col).doc(op.id);op.type==='set'?batch.set(ref,op.obj):batch.delete(ref)});
    await batch.commit();
   }
   cloudBaseline[k]=now;
  }
  await cloudDB.collection('app_meta').doc('main').set({n:D.n||{},updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
 }finally{cloudBusy=false}
}
function cloudLocalHasData(x){return Object.values(CLOUD_COLLECTIONS).some(k=>Array.isArray(x[k])&&x[k].length>0)}
function mergeRecords(local,remote){
 const byId=new Map();(local||[]).forEach(x=>{if(x&&x.id)byId.set(String(x.id),x)});
 (remote||[]).forEach(x=>{if(x&&x.id)byId.set(String(x.id),x)});
 return [...byId.values()];
}
async function bootCloud(){
 try{
  let cloud={C:[],S:[],W:[],L:[],P:[],DR:[],CH:[],n:{}};
  let cloudCount=0;
  for(const [k,col] of Object.entries(CLOUD_COLLECTIONS)){
   const snap=await cloudDB.collection(col).get();
   cloud[k]=snap.docs.map(d=>d.data());cloudCount+=snap.size;
  }
  const meta=await cloudDB.collection('app_meta').doc('main').get();if(meta.exists)cloud.n=meta.data().n||{};
  const local=D;
  if(cloudCount===0&&cloudLocalHasData(local)){
   // First connection: migrate the existing browser data into Firestore.
   cloud=CLOUD_COLLECTIONS?{...cloud,...local}:cloud;
   cloud.n=local.n||{};
   D=cloud;cloudReady=true;await syncCloud();
   toast('Existing data migrated to Firebase');
  }else{
   // Cloud data is authoritative, while local-only records are retained and uploaded.
   for(const k of Object.keys(CLOUD_COLLECTIONS))D[k]=mergeRecords(local[k],cloud[k]);
   D.n={...(cloud.n||{}),...(local.n||{})};cloudReady=true;await syncCloud();
  }
  try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}
  attachCloudListeners();draw();
 }catch(e){console.error('Firebase initialization/load error',e);cloudReady=false;toast('Firebase unavailable — using local saved data')}
}
function attachCloudListeners(){
 cloudListeners.forEach(unsub=>{try{unsub()}catch(e){}});cloudListeners=[];
 for(const [k,col] of Object.entries(CLOUD_COLLECTIONS)){
  const unsub=cloudDB.collection(col).onSnapshot(snap=>{
   if(!cloudReady)return;
   const arr=snap.docs.map(d=>d.data());
   const incoming={};arr.forEach(x=>{if(x&&x.id)incoming[String(x.id)]=x});
   cloudBaseline[k]=incoming;
   D[k]=arr;
   try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}
   draw();
  },err=>console.error('Firestore listener',col,err));cloudListeners.push(unsub);
 }
 cloudListeners.push(cloudDB.collection('app_meta').doc('main').onSnapshot(doc=>{if(doc.exists&&doc.data().n){D.n=doc.data().n;try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}}));
}

function invView(inv){const s=D.S.find(x=>x.inv==inv);if(!s)return;const c=cu(s.cid),g=s.gst,none=g.mode=='none',ad=[c.addr,c.city,[c.state,c.pin].filter(Boolean).join(' - ')].filter(Boolean).join(', ');
 const rows=s.items.map((l,i)=>`<tr><td>${i+1}</td><td><b>${esc(pn(l.code,l.name))}</b>${l.desc?`<div class="k dsc">${esc(l.desc)}</div>`:''}</td><td>${wl(l.wm)}</td><td>${l.q}</td><td>${inr(l.price)}</td><td>${l.disc?l.disc+'%':'—'}</td><td><b>${inr(l.price*l.q*(1-(l.disc||0)/100))}</b></td></tr>`).join('');
 md(`<div class="row noprint"><button onclick="cl()">← Back</button><button class="p" onclick="printInv('${esc(s.inv)}')">Print / Save PDF</button></div><div class="inv"> <div class="iv-top"><div class="iv-co"><img class="logo" src="${LOGO}" alt="Eleven Pearl"><div><div class="iv-brand">ELEVEN PEARL</div><div class="iv-sub">Nakoda Sales Corporation<br>Surat, Gujarat, India<br>Phone: 9898614926<br>Email: elevenpearllighting@gmail.com</div></div></div><div class="iv-title"><h1>INVOICE</h1><div class="iv-meta"><span>Invoice no.</span><b>${esc(s.inv)}</b><span>Date</span><b>${dt(s.date)}</b></div></div></div>
 <div class="iv-box"><div class="iv-lbl">Billed to</div><b style="font-size:17px">${esc(c.name)}</b>${c.company?'<br>'+esc(c.company):''}${c.phone?'<br>Phone: '+esc(c.phone):''}${c.email?'<br>'+esc(c.email):''}${ad?'<br>'+esc(ad):''}${c.gst&&!none?'<br>GSTIN: '+esc(c.gst):''}</div>
 <div class="tw" style="margin-top:20px"><table class="it"><tr><th>#</th><th>Product</th><th>Warranty</th><th>Qty</th><th>Price</th><th>Disc.</th><th>Total</th></tr>${rows}</table></div>
 <div class="sum">${none?'':`<div><span>Subtotal</span><span>${inr(s.sub)}</span></div><div><span>GST @ ${g.rate}%</span><span>${inr(s.tax)}</span></div>`}<div class="gt"><span>Grand total</span><span>${inr(s.total)}</span></div></div>
 ${s.items.some(l=>l.wm)?`<div class="iv-note"><div class="iv-lbl">Warranty terms</div>• Warranty applies from the invoice date for the period shown against each product.<br>• It covers manufacturing defects only.<br>• It does not cover physical damage, improper installation, tampering or electrical surges.</div>`:''}
 <div class="iv-sign"><div class="iv-foot2">Please retain this invoice for warranty/service claims.</div><div style="text-align:center"><img class="sig" src="${SIG}" alt="Signature"><div style="padding-top:6px;min-width:190px;font-size:13px">Authorised Signatory<br><b>Eleven Pearl</b></div></div></div><div class="iv-legal">This is a computer-generated invoice and is not an official GST tax invoice.</div></div>`)}
const opts=(a,cur,ph)=>`<option value="">${ph}</option>`+(a.includes(cur)||!cur?a:[...a,cur]).map(x=>`<option ${x==cur?'selected':''}>${esc(x)}</option>`).join('');
const lh=(l,i)=>`<div class="ln li"><div class="li-h"><div class="li-n"><i>${i+1}</i>Item ${i+1}</div><div style="display:flex;align-items:center;gap:12px"><span class="li-t lt"></span>${SL.length>1?`<button onclick="rmLn(${i})">✕ Remove</button>`:''}</div></div>
<label>Product *</label><div class="pk"><input class="ps" placeholder="Search product by code or name…" autocomplete="off" value="${esc(plabel(l.pid))}" onfocus="pkOpen(this)" oninput="pkOpen(this)" onblur="setTimeout(()=>pkClose(this),120)"><input type="hidden" class="a" value="${l.pid}"><div class="pl"></div></div>
<div class="li-g li-g4"><div><label>Quantity</label><input class="q" type="number" min="1" value="${l.q}" oninput="tot()"></div><div><label>Price ₹</label><input class="p2" type="number" value="${l.price}" oninput="tot()"></div><div><label>Discount %</label><input class="d" type="number" min="0" max="100" value="${l.disc}" oninput="tot()"></div><div><label>Warranty</label><select class="w">${[0,6,12,24,36,60].map(m=>`<option value="${m}" ${m==l.wm?'selected':''}>${wl(m)}</option>`).join('')}</select></div></div>
<div class="li-g li-g2"><div><label>Driver company</label><select class="dr">${opts(D.DR,l.drv,'Select driver…')}</select></div><div><label>Chip company</label><select class="ch">${opts(D.CH,l.chip,'Select chip…')}</select></div></div>
<label>Description <span style="font-weight:400">(shown on invoice)</span></label><textarea class="ds" rows="2" placeholder="Optional — appears under the product name on the invoice">${esc(l.desc)}</textarea></div>`;
const blank=()=>({pid:'',q:1,price:0,disc:0,wm:24,drv:'',chip:'',desc:''});
function saleForm(h){if(!D.C.length){toast('Add a customer first');return custForm()}if(!D.P.length){toast('Add a product first');page='prod';draw();return prodForm()}let n=D.S.length+1;const fm=k=>'EP-'+new Date().getFullYear()+'-'+String(k).padStart(4,'0');while(D.S.some(x=>x.inv==fm(n)))n++;if(!h)SL=[blank()];h=h||{};md(`<h2>New sale</h2><div class="two"><div><label>Customer *</label><select id="f1">${D.C.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>${fld('Invoice number','f2',fm(n))}${fld('Sale date','f4',new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),'date')}<div><label>GST</label><select id="f5" onchange="tot()"><option value="add">With GST</option><option value="none">Without GST</option></select></div><div id="gr"><label>GST rate %</label><input id="f6" type="number" value="18" oninput="tot()"></div></div><h3>Items</h3><div id="ls"></div><button class="p" onclick="addLn()">+ Add item</button><div class="tot" style="display:block"><div class="row" style="margin:0"><span>Subtotal</span><span id="ts"></span></div><div id="gx" class="row" style="margin:4px 0"><span id="tl"></span><span id="tg"></span></div><div class="row" style="margin:0"><b>Total</b><b id="tt"></b></div></div><div class="row" style="margin:0"><button onclick="cl()">Cancel</button><button class="p" onclick="doSale()">Create invoice</button></div>`);if(h.c){$('#f1').value=h.c;$('#f2').value=h.i;$('#f4').value=h.d;$('#f5').value=h.m;$('#f6').value=h.r}rl()}
function rl(){$('#ls').innerHTML=SL.map(lh).join('');tot()}
function rd(){SL=[...document.querySelectorAll('.ln')].map(r=>{const f=c=>r.querySelector(c).value,p=D.P.find(x=>x.id==f('.a'))||{};return{pid:p.id||'',code:p.code||'',name:p.name||'',q:Math.max(1,Math.floor(+f('.q')||1)),price:+f('.p2')||0,disc:Math.min(100,Math.max(0,+f('.d')||0)),wm:+f('.w'),drv:f('.dr'),chip:f('.ch'),desc:f('.ds').trim()}})}
const getG=()=>({mode:$('#f5').value,rate:Math.max(0,+$('#f6').value||0)});
function tot(){rd();document.querySelectorAll('.ln').forEach((r,i)=>{const e=r.querySelector('.lt');if(e&&SL[i])e.textContent=inr(SL[i].price*SL[i].q*(1-SL[i].disc/100))});const g=getG(),sub=sum(SL,l=>l.price*l.q*(1-l.disc/100)),n=g.mode=='none';$('#gr').style.display=$('#gx').style.display=n?'none':'';$('#ts').textContent=inr(sub);$('#tl').textContent='GST @ '+g.rate+'%';$('#tg').textContent=inr(sub*g.rate/100);$('#tt').textContent=inr(n?sub:sub*(1+g.rate/100))}
const plabel=id=>{const p=D.P.find(x=>x.id==id);return p?pn(p.code,p.name):''};
function pkOpen(el){const pk=el.parentNode,box=pk.querySelector('.pl'),cur=plabel(pk.querySelector('.a').value),q=el.value.trim().toLowerCase(),all=q==cur.toLowerCase(),M=D.P.filter(p=>all||!q||[p.code,p.name].some(x=>String(x||'').toLowerCase().includes(q)));
 box.innerHTML=M.slice(0,8).map(p=>`<div class="opt" onmousedown="pkPick(this,'${p.id}')"><b>${esc(pn(p.code,p.name))}</b><div class="k">${inr(p.price)} · ${wl(p.wm)}${p.drv?' · '+esc(p.drv):''}${p.chip?' / '+esc(p.chip):''}</div></div>`).join('')+(q&&!M.length?'<div class="k" style="padding:10px 12px">No product matches “'+esc(el.value)+'”</div>':'')+`<div class="opt" onmousedown="pkNew(this)" style="color:var(--ac);font-weight:600">＋ Create new product…</div>`;box.style.display='block'}
function pkClose(el){const pk=el.closest('.pk');pk.querySelector('.pl').style.display='none';pk.querySelector('.ps').value=plabel(pk.querySelector('.a').value)}
function pkPick(el,id){const r=el.closest('.ln'),p=D.P.find(x=>x.id==id),v=(c,x)=>r.querySelector(c).value=x;v('.a',id);v('.ps',pn(p.code,p.name));v('.p2',p.price);v('.w',p.wm);v('.dr',p.drv||'');v('.ch',p.chip||'');v('.ds',p.desc||'');r.querySelector('.pl').style.display='none';tot()}

 addSale($('#f1').value,inv,($('#f4').value?new Date($('#f4').value+'T00:00').getTime():Date.now()),SL,getG());save();cl();page='sales';draw();invView(inv);toast(inv+' created')}

const clist=(k,t)=>`<div class="card"><div class="row" style="margin-bottom:8px"><b>${t}</b><span class="b n">${D[k].length}</span></div><div class="row" style="flex-wrap:nowrap;margin:0"><input id="in${k}" placeholder="Add company name" onkeydown="if(event.key=='Enter')addCo('${k}')"><button class="p" onclick="addCo('${k}')">Add</button></div><div class="chips">${D[k].map((n,i)=>`<span class="chip">${esc(n)}<a onclick="rmCo('${k}',${i})" title="Remove">×</a></span>`).join('')||'<div class="k">None added yet</div>'}</div></div>`;
function prod(){return `<div class="row"><div><h2>Products</h2><div class="sub">${D.P.length} products · ${D.DR.length} driver · ${D.CH.length} chip companies</div></div><button class="p" onclick="prodForm()">+ New product</button></div>${ptab()}<h3>Driver &amp; chip companies</h3><div class="two">${clist('DR','Driver companies')}${clist('CH','Chip companies')}</div>`}
function addCo(k){const n=$('#in'+k).value.trim();if(!n)return;if(D[k].some(x=>x.toLowerCase()==n.toLowerCase()))return toast('Already in the list');D[k].push(n);D[k].sort((a,b)=>a.localeCompare(b));save();draw();toast(n+' added');$('#in'+k).focus()}
function rmCo(k,i){D[k].splice(i,1);save();draw()}
function prodForm(id){const p=D.P.find(x=>x.id==id)||{wm:24,price:''};md(`<h2>${id?'Edit product':'New product'}</h2><div class="two">${fld('Product code','f1',p.code||'','text','e.g. ZV-TRK-12')}${fld('Product name *','f2',p.name||'')}${fld('Default price ₹','f3',p.price,'number')}<div><label>Default warranty</label><select id="f4">${[0,6,12,24,36,60].map(m=>`<option value="${m}" ${m==p.wm?'selected':''}>${wl(m)}</option>`).join('')}</select></div><div><label>Default driver company</label><select id="f5">${opts(D.DR,p.drv||'','None')}</select></div><div><label>Default chip company</label><select id="f6">${opts(D.CH,p.chip||'','None')}</select></div></div>${D.DR.length&&D.CH.length?'':'<div class="k" style="margin-top:8px">Tip: add driver and chip companies on the Products page to pick them here.</div>'}<label>Description</label><textarea id="f7" rows="2">${esc(p.desc||'')}</textarea><div class="row" style="margin:18px 0 0"><button onclick="PEND?backSale():cl()">Cancel</button><button class="p" onclick="saveProd('${id||''}')">Save product</button></div>`)}
function saveProd(id){const name=$('#f2').value.trim(),code=$('#f1').value.trim();if(!name)return toast('Product name is required');if(code&&D.P.some(x=>x.id!=id&&(x.code||'').toLowerCase()==code.toLowerCase()))return toast('Product code already exists');
 const p={id:id||'p'+Date.now(),code,name,price:+$('#f3').value||0,wm:+$('#f4').value,drv:$('#f5').value,chip:$('#f6').value,desc:$('#f7').value.trim()},k=D.P.findIndex(x=>x.id==id);k<0?D.P.push(p):D.P[k]=p;save();if(PEND){const q=PEND;PEND=null;Object.assign(SL[q.idx],{pid:p.id,code:p.code,name:p.name,price:p.price,wm:p.wm,drv:p.drv,chip:p.chip,desc:p.desc});saleForm(q.h);return toast(name+' added to this invoice')}cl();page='prod';draw();toast(name+(id?' updated':' added'))}
function delAsk(id){const p=D.P.find(x=>x.id==id);ask('Delete "'+p.name+'"? Past invoices and warranties keep their details.',()=>{D.P=D.P.filter(x=>x.id!=id);save();cl();draw();toast('Product deleted')})}
/* warranties */
function wtab(W){return tbl(['Customer','Invoice','Product','Qty','Purchase Date','Warranty Until','Status','Days Remaining'],W.map(w=>{const d=dd(w.end);return `<tr class="c" onclick="wView('${w.id}')"><td>${esc(cu(w.cid).name)}</td><td>${esc(w.inv)}</td><td>${esc(wp(w))}</td><td>${w.qty}</td><td>${dt(w.date)}</td><td>${dt(w.end)}</td><td>${sb(w.end)}</td><td>${d>=0?d+' days':'Expired '+(-d)+' days ago'}</td></tr>`}),'No warranty records')}
const mw=(w,q)=>{q=q.toLowerCase().trim();const c=cu(w.cid),d=q.replace(/\D/g,'');return [w.inv,w.product,w.code,c.name,c.company].some(x=>String(x||'').toLowerCase().includes(q))||(/^[\d\s+]+$/.test(q)&&d.length>=3&&String(c.phone||'').replace(/\D/g,'').includes(d))};
function warr(){return `<div class="row"><div><h2>Warranties</h2><div class="sub">${D.W.length} warranty records · one per invoice line</div></div></div><div id="wt">${wtab([...D.W].reverse())}</div>`}
const wcard=w=>box(kv('Customer',cu(w.cid).name)+kv('Phone',cu(w.cid).phone)+kv('Invoice',w.inv)+kv('Product',wp(w))+kv('Quantity sold',w.qty)+kv('Purchase date',dt(w.date))+kv('Warranty period',wl(w.wm))+kv('Warranty expiry',dt(w.end))+`<div><div class="k">Status</div>${sb(w.end)}</div>`+kv('Days remaining',dl(w.end))+kv('Driver company',w.drv)+kv('Chip company',w.chip));
function wView(id){const w=wr(id);md(`<div class="row"><div><h2>${esc(wp(w))}</h2><div class="sub">${esc(cu(w.cid).name)} · ${esc(w.inv)}</div></div><button onclick="cl()">Close</button></div>${wcard(w)}<div class="row" style="margin:14px 0"><span class="k">Claims so far: ${D.L.filter(c=>c.wid==id).length}</span><button class="p" onclick="claimForm('${id}')">Raise warranty claim</button></div><h3>Claims on this warranty</h3>${ctabl(D.L.filter(l=>l.wid==id))}`)}
/* claims */
function ctabl(L){return tbl(['Claim No.','Date','Customer','Invoice','Product','Defective Qty','Warranty','Driver','Chip'],L.map(c=>`<tr class="c" onclick="claimView('${c.id}')"><td><b>${c.no}</b></td><td>${dt(c.cdate)}</td><td>${esc(cu(c.cid).name)}</td><td>${esc(c.inv)}</td><td>${esc(c.product)}</td><td>${c.n} of ${c.qty}</td><td>${bd(c.war,c.war=='ACTIVE'?'g':'r')}</td><td>${esc(c.drv||'—')}</td><td>${esc(c.chip||'—')}</td></tr>`),'No claims yet')}
function claims(){return `<div class="row"><div><h2>Warranty claims</h2><div class="sub">${D.L.length} claims</div></div></div><div id="lt">${ctabl([...D.L].reverse())}</div>`}
const mc=(c,q)=>{q=q.toLowerCase().trim();return String(c.no).toLowerCase().includes(q)||mw({...wr(c.wid),cid:c.cid,inv:c.inv,product:c.product,code:''},q)};
function claimView(id){const c=D.L.find(x=>x.id==id);md(`<div class="row"><div><h2>${c.no}</h2><div class="sub">Claimed ${dt(c.cdate)}</div></div><button onclick="cl()">Close</button></div>${box(kv('Customer',cu(c.cid).name)+kv('Phone',cu(c.cid).phone)+kv('Invoice',c.inv)+kv('Product',c.product)+kv('Quantity sold',c.qty)+kv('Defective quantity',c.n)+kv('Purchase date',dt(c.date))+kv('Warranty expiry',dt(c.end))+`<div><div class="k">Warranty at time of claim</div>${bd(c.war,c.war=='ACTIVE'?'g':'r')}</div>`+kv('Days remaining',c.days>=0?c.days+' days':'Expired '+(-c.days)+' days ago')+kv('Driver company',c.drv)+kv('Chip company',c.chip))}<h3>Complaint</h3><div class="card dsc">${esc(c.issue||'—')}</div>`)}
function claimForm(wid){CW=null;md(`<h2>New warranty claim</h2>${wid?'':`<label>Find the warranty — customer, phone, invoice, product name or code</label><input id="cq" autocomplete="off" oninput="cs()" placeholder="e.g. 98765, EP-2026-1042 or ABC"><div id="cs" style="margin-top:6px"></div>`}<div id="cd" style="margin-top:12px"></div>`);wid?showW(wid):$('#cq').focus()}
function cs(){const q=$('#cq').value.trim();$('#cd').innerHTML='';CW=null;if(q.length<2){$('#cs').innerHTML='';return}const M=D.W.filter(w=>mw(w,q));
 $('#cs').innerHTML=M.length?`<div class="card" style="padding:4px;max-height:270px;overflow:auto">${M.slice(0,8).map(w=>`<div class="opt" onclick="showW('${w.id}')"><b>${esc(wp(w))}</b> <span class="b n">× ${w.qty}</span> ${sb(w.end)}<div class="k">${esc(cu(w.cid).name)} · ${esc(w.inv)} · ${dl(w.end)}</div></div>`).join('')}${M.length>8?`<div class="k" style="padding:8px 12px">+${M.length-8} more — keep typing to narrow down</div>`:''}</div>`:'<div class="k">No matching warranty found</div>'}
function showW(id){CW=id;const w=wr(id),ex=dd(w.end)<0;if($('#cs'))$('#cs').innerHTML='';$('#cd').innerHTML=`${wcard(w)}<div class="k" style="margin-top:8px">Previous claims: ${D.L.filter(c=>c.wid==id).length} · ${claimed(id)} unit(s) claimed so far</div>${ex?`<div class="card" style="margin-top:14px;color:var(--r)"><b>Warranty expired on ${dt(w.end)}.</b> New claims can't be raised.</div><div class="row" style="margin:16px 0 0"><button onclick="cl()">Close</button></div>`:`<label>Defective quantity (max ${w.qty} per claim)</label><input id="dq" type="number" min="1" max="${w.qty}" value="1"><label>Problem / complaint (optional)</label><textarea id="pc" rows="3"></textarea><div class="row" style="margin:16px 0 0"><button onclick="cl()">Cancel</button><button class="p" onclick="doClaim()">Create claim</button></div>`}`}
function doClaim(){const w=wr(CW);if(!w.id)return toast('Select a warranty first');const n=Math.floor(+$('#dq').value||0);if(n<1)return toast('Enter the defective quantity');if(dd(w.end)<0)return toast('Warranty expired on '+dt(w.end)+' — no new claims');if(n>w.qty)return toast('Defective quantity cannot exceed quantity sold ('+w.qty+')');
 const c=mkc(w,n,$('#pc').value.trim());D.L.push(c);save();cl();page='claims';draw();toast(c.no+' created · '+n+' defective')}
/* search */
function search(){const q=($('#q').value||'').trim().toLowerCase();if(!q)return '<h2>Search</h2><div class="sub">Type a customer, phone number, invoice or product name.</div>';const d=q.replace(/\D/g,''),C=D.C.filter(c=>[c.name,c.company,c.city,c.gst].some(x=>String(x||'').toLowerCase().includes(q))||(/^[\d\s+]+$/.test(q)&&d.length>=3&&String(c.phone||'').replace(/\D/g,'').includes(d))),W=D.W.filter(w=>mw(w,q)),L=D.L.filter(c=>mc(c,q)),S=D.S.filter(x=>[x.inv,cu(x.cid).name,...x.items.map(i=>pn(i.code,i.name))].some(t=>String(t).toLowerCase().includes(q)));
 return `<h2>Results for “${esc(q)}”</h2><h3>Customers (${C.length})</h3>${tbl(['Name','Phone','City'],C.map(c=>`<tr class="c" onclick="custView('${c.id}')"><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.city)}</td></tr>`),'No customers match')}<h3>Invoices (${S.length})</h3>${tbl(['Invoice','Date','Customer','Total'],S.map(x=>`<tr class="c" onclick="invView('${x.inv}')"><td><b>${esc(x.inv)}</b></td><td>${dt(x.date)}</td><td>${esc(cu(x.cid).name)}</td><td>${inr(x.total)}</td></tr>`),'No invoices match')}<h3>Warranties (${W.length})</h3>${wtab(W)}<h3>Claims (${L.length})</h3>${ctabl(L)}`}
load();try{history.replaceState({p:'dash'},'')}catch(e){}draw();bootCloud();
</script></body></html>
